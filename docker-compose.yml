# Docker Compose configuration for the SIS scraper development environment.
#
# This Compose file includes a shared development environment configuration
# from the Project-CARPI/.github repository, which contains a database service
# and a shared Docker network for testing.
#
# To start the development environment, run:
# docker compose run --rm sis-scraper
#
# This will start both the shared development environment and the sis-scraper
# container, opening a bash shell in the sis-scraper container for interactive
# use. The shell can be exited via "exit" or Ctrl+D.
#
# The shared development environment will continue running in the background by
# default after the shell is exited. This is to allow the database to remain
# available for subsequent runs of the SIS scraper container or for other
# services in the organization, such as the API.
#
# To stop the shared development environment, run:
# docker compose down
#
# The test database volume persists between Docker start and stop cycles; it must
# be manually removed in order to recreate the database from scratch.

name: sis-scraper-dev-environment

include:
  - https://github.com/Project-CARPI/.github.git#main:shared-dev-env/docker-compose.yml

services:
  sis-scraper:
    build: .
    image: sis-scraper:latest
    container_name: sis-scraper
    # Ensure image is built locally and is not pulled from a registry
    pull_policy: build
    restart: on-failure
    # Enable interactive mode to allow scraper command input and output
    stdin_open: true
    tty: true
    env_file:
      - .env
    # Override the DB_HOSTNAME environment variable
    environment:
      DB_HOSTNAME: db:3306
    # Override the Dockerfile's CMD ("cron -f")
    # Allows bash commands to be run interactively for development purposes
    command: ["bash"]
    # Mount local code over the code built into the container for automatic
    # reloading during development.
    volumes:
      - .:/scraper
    networks:
      - carpi-dev-network
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: requirements.txt
