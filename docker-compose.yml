# Docker Compose configuration for the SIS scraper development environment.
#
# This file defines two services: a test MySQL database and the SIS scraper
# application itself.
#
# To start the development environment, run:
# docker compose run --rm sis-scraper bash && docker compose down
#
# This will start the containers, open a bash shell in the sis-scraper container
# for interactive use, and then stop the containers when you exit the shell.
#
# The bash shell can be exited via "exit" or Ctrl+D, which will then trigger the
# "docker compose down" command to stop the containers and clean up resources.
#
# The test database volume persists between Docker start and stop cycles; it must
# be manually removed in order to recreate the database from scratch.

name: sis-scraper-dev-stack

services:
  db:
    image: mysql:8.0
    container_name: test_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_SCHEMA}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-u",
          "${DB_USERNAME}",
          "--password=${DB_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  sis-scraper:
    build: .
    image: sis-scraper:latest
    container_name: sis-scraper
    # Ensure image is built locally and is not pulled from a registry
    pull_policy: build
    restart: on-failure
    # Enable interactive mode to allow scraper command input and output
    stdin_open: true
    tty: true
    env_file:
      - .env
    # Override the Dockerfile's CMD ("cron -f")
    # This keeps the container running indefinitely doing nothing, allowing you
    # to exec into it to run commands interactively.
    command: ["bash"]
    # Mount local code over the code built into the container for automatic
    # reloading during development.
    volumes:
      - .:/scraper
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: requirements.txt

volumes:
  mysql_data:
